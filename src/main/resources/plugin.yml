name: GachaCrate
version: '${version}'
main: com.kazumiii.gachacrate.GachaCrate
api-version: '1.20'
author: Kazumiii
description: A Minecraft Survival server gacha crate plugin with full in-game editing.

softdepend: [DecentHolograms, PlaceholderAPI, Vault]

commands:
  gacha:
    description: Main command for the GachaCrate plugin.
    usage: /gacha help
    aliases: [gc, crate]

permissions:
  gacha.*:
    description: Grants access to all GachaCrate features.
    default: op
    children:
      gacha.admin: true
      gacha.user: true

  gacha.admin:
    description: Grants access to all admin commands.
    default: op
    children:
      gacha.admin.create: true
      gacha.admin.delete: true
      gacha.admin.additem: true
      gacha.admin.addcmd: true
      gacha.admin.edit: true
      gacha.admin.givekey: true
      gacha.admin.stats.other: true
      gacha.admin.setblock: true
      gacha.admin.open: true
      gacha.admin.resetpity: true
      gacha.admin.reload: true
      gacha.admin.history.other: true

  gacha.user:
    description: Grants access to all user-level commands and actions.
    default: true
    children:
      gacha.user.view: true
      gacha.user.stats.self: true
      gacha.user.massopen: true
      gacha.user.daily: true
      gacha.user.shop: true
      gacha.user.history: true
      gacha.user.top: true

  # Admin permissions
  gacha.admin.create:
    description: Allows creating new crates.
    default: op
  gacha.admin.delete:
    description: Allows deleting existing crates.
    default: op
  gacha.admin.additem:
    description: Allows use of the /gacha additem command.
    default: op
  gacha.admin.addcmd:
    description: Allows use of the /gacha addcmd command.
    default: op
  gacha.admin.edit:
    description: Allows full use of the /gacha GUI editor.
    default: op
  gacha.admin.givekey:
    description: Allows giving crate keys to players.
    default: op
  gacha.admin.stats.other:
    description: Allows viewing the stats of other players.
    default: op
  gacha.admin.setblock:
    description: Allows setting and removing physical crate blocks.
    default: op
  gacha.admin.open:
    description: Allows opening a crate for free (no key) with /gacha open.
    default: op
  gacha.admin.resetpity:
    description: Allows resetting a player's pity counter.
    default: op
  gacha.admin.reload:
    description: Allows reloading the plugin's files.
    default: op
  gacha.admin.history.other:
    description: Allows viewing other players' win history.
    default: op

  # User permissions
  gacha.user.view:
    description: Allows players to preview crate rewards.
    default: true
  gacha.user.stats.self:
    description: Allows a player to view their own stats.
    default: true
  gacha.user.massopen:
    description: Allows sneak + right-click to open many keys at once.
    default: true
  gacha.user.daily:
    description: Allows claiming daily free keys.
    default: true
  gacha.user.shop:
    description: Allows buying keys in the shop.
    default: true
  gacha.user.history:
    description: Allows viewing your own wins and the server's recent big wins.
    default: true
  gacha.user.top:
    description: Allows viewing the leaderboard.
    default: true
  gacha.user.open.*:
    description: >-
      Allows opening every crate. Each crate also gets its own permission,
      gacha.user.open.<crate>, which everyone has by default. Negate it to lock a crate.
    default: true
