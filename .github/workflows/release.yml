# Publishes a GitHub Release with the plugin jar when a version tag is pushed (e.g. v2.2.0).
# Servers running GachaCrate check these releases and tell admins about new versions.
#
# To release: bump `version` in build.gradle.kts, merge to main, then create a tag:
#   GitHub → Releases → "Draft a new release" → tag "v2.2.0" → Publish.
name: Release GachaCrate

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build with Gradle
        run: gradle build --no-daemon

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/GachaCrate-*.jar
          generate_release_notes: true
